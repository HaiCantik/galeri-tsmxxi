<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Studio</title>
<style>
:root{--bg:#0f1115;--card:#1a1d24;--line:#2a2e38;--txt:#e8eaf0;--acc:#4f8cff}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--txt)}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line)}
h1{font-size:18px;margin:0}
button,label.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;font-size:14px}
button.sec{background:var(--card);border:1px solid var(--line);color:var(--txt)}
button.del{background:#c0392b}
#drop{margin:20px;padding:30px;border:2px dashed var(--line);border-radius:12px;text-align:center;color:#9aa0ad}
#drop.over{border-color:var(--acc);color:var(--acc)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;padding:0 20px 30px}
.item{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.item .thumb{height:130px;width:100%;object-fit:cover;display:block;background:#000;cursor:pointer}
.item .meta{padding:8px;font-size:12px;display:flex;justify-content:space-between;gap:6px;align-items:center}
.item .meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .meta button{padding:4px 8px;font-size:12px}
#editor{display:none;position:fixed;inset:0;background:var(--bg);z-index:10;flex-direction:column}
#editor.open{display:flex}
.ebody{display:flex;flex:1;min-height:0;flex-wrap:wrap}
.stage{flex:1 1 400px;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0;background:#000}
canvas{max-width:100%;max-height:100%}
.panel{width:320px;max-width:100%;padding:16px;overflow:auto;border-left:1px solid var(--line)}
.panel h3{margin:14px 0 6px;font-size:13px;color:#9aa0ad;text-transform:uppercase}
.row{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.row label{width:90px}.row input[type=range]{flex:1}
input[type=text]{width:100%;padding:8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--txt)}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
#status{padding:8px 16px;font-size:13px;color:#9aa0ad}
</style>
</head>
<body>
<header><h1>🎬 Media Studio</h1>
<label class="btn">+ Upload<input id="fi" type="file" accept="image/*,video/*" multiple hidden></label></header>
<div id="drop">Tarik &amp; lepas foto / video ke sini</div>
<div id="grid"></div>

<div id="editor">
  <header><h1 id="etitle">Editor</h1><button class="sec" onclick="closeEd()">✕ Tutup</button></header>
  <div class="ebody">
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="panel">
      <h3>Filter</h3>
      <div class="row"><label>Brightness</label><input type="range" id="brightness" min="0" max="200" value="100"></div>
      <div class="row"><label>Contrast</label><input type="range" id="contrast" min="0" max="200" value="100"></div>
      <div class="row"><label>Saturasi</label><input type="range" id="saturate" min="0" max="300" value="100"></div>
      <div class="row"><label>Blur</label><input type="range" id="blur" min="0" max="10" value="0"></div>
      <div class="row"><label>Grayscale</label><input type="range" id="grayscale" min="0" max="100" value="0"></div>
      <div class="row"><label>Sepia</label><input type="range" id="sepia" min="0" max="100" value="0"></div>
      <h3>Teks</h3>
      <input type="text" id="txt" placeholder="Tulis teks...">
      <div class="row"><label>Ukuran</label><input type="range" id="tsize" min="10" max="200" value="48"></div>
      <div class="row"><label>Posisi Y</label><input type="range" id="ty" min="0" max="100" value="85"></div>
      <div class="row"><label>Warna</label><input type="color" id="tcol" value="#ffffff"></div>
      <div id="imgTools">
        <h3>Transform</h3>
        <div class="btns"><button class="sec" onclick="rot()">⟳ Putar 90°</button><button class="sec" onclick="flip()">⇋ Flip</button></div>
      </div>
      <div id="vidTools">
        <h3>Video</h3>
        <div class="row"><label>Mulai (dtk)</label><input type="range" id="vstart" min="0" max="10" step="0.1" value="0"></div>
        <div class="row"><label>Selesai (dtk)</label><input type="range" id="vend" min="0" max="10" step="0.1" value="10"></div>
        <div class="row"><label>Kecepatan</label><input type="range" id="vspeed" min="0.25" max="3" step="0.25" value="1"></div>
        <div class="btns"><button class="sec" onclick="playPrev()">▶ Preview</button></div>
      </div>
      <h3>Simpan</h3>
      <div class="btns">
        <button onclick="exportMedia(true)">💾 Simpan ke D:</button>
        <button class="sec" onclick="exportMedia(false)">⬇ Download</button>
      </div>
    </div>
  </div>
  <div id="status"></div>
</div>

<script>
const $ = id => document.getElementById(id);
const grid = $('grid'), cv = $('cv'), ctx = cv.getContext('2d');
let el = null, kind = null, rotation = 0, flipped = false, raf = null, exporting = false;

// ===== Library =====
async function load() {
  const list = await (await fetch('/api/media')).json();
  grid.innerHTML = '';
  list.forEach(m => {
    const d = document.createElement('div'); d.className = 'item';
    const src = '/files/' + m.filename;
    d.innerHTML = (m.type === 'image'
      ? `<img class="thumb" src="${src}">`
      : `<video class="thumb" src="${src}#t=0.5" muted preload="metadata"></video>`) +
      `<div class="meta"><span title="${m.original}">${m.original}</span><span>
      <button class="sec">Edit</button> <button class="del">🗑</button></span></div>`;
    d.querySelector('.thumb').onclick = () => openEd(m);
    d.querySelector('.sec').onclick = () => openEd(m);
    d.querySelector('.del').onclick = async () => {
      if (!confirm('Hapus file ini?')) return;
      await fetch('/api/media/' + m.id, { method: 'DELETE' }); load();
    };
    grid.appendChild(d);
  });
}
async function upFiles(files) {
  const fd = new FormData();
  [...files].forEach(f => fd.append('files', f));
  $('drop').textContent = 'Mengupload...';
  await fetch('/api/upload', { method: 'POST', body: fd });
  $('drop').textContent = 'Tarik & lepas foto / video ke sini';
  load();
}
$('fi').onchange = e => upFiles(e.target.files);
const drop = $('drop');
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); upFiles(e.dataTransfer.files); };

// ===== Editor =====
function resetCtl() {
  ['brightness','contrast','saturate'].forEach(i => $(i).value = 100);
  ['blur','grayscale','sepia'].forEach(i => $(i).value = 0);
  $('txt').value = ''; rotation = 0; flipped = false;
}
function openEd(m) {
  resetCtl(); kind = m.type;
  $('etitle').textContent = m.original;
  $('editor').classList.add('open');
  $('imgTools').style.display = kind === 'image' ? '' : 'none';
  $('vidTools').style.display = kind === 'video' ? '' : 'none';
  const src = '/files/' + m.filename;
  if (kind === 'image') {
    el = new Image(); el.onload = () => { startLoop(); }; el.src = src;
  } else {
    el = document.createElement('video'); el.src = src; el.preload = 'auto'; el.playsInline = true;
    el.onloadedmetadata = () => {
      $('vstart').max = $('vend').max = el.duration;
      $('vstart').value = 0; $('vend').value = el.duration;
      el.currentTime = 0; startLoop();
    };
  }
}
function closeEd() {
  cancelAnimationFrame(raf);
  if (el && el.pause) el.pause();
  el = null; $('editor').classList.remove('open'); $('status').textContent = '';
}
function filterStr() {
  return `brightness(${$('brightness').value}%) contrast(${$('contrast').value}%) saturate(${$('saturate').value}%) blur(${$('blur').value}px) grayscale(${$('grayscale').value}%) sepia(${$('sepia').value}%)`;
}
function draw() {
  if (!el) return;
  const w = kind === 'image' ? el.naturalWidth : el.videoWidth;
  const h = kind === 'image' ? el.naturalHeight : el.videoHeight;
  if (!w) return;
  const swap = rotation % 180 !== 0;
  const cw = swap ? h : w, ch = swap ? w : h;
  if (cv.width !== cw || cv.height !== ch) { cv.width = cw; cv.height = ch; }
  ctx.clearRect(0, 0, cw, ch);
  ctx.save();
  ctx.filter = filterStr();
  ctx.translate(cw / 2, ch / 2);
  ctx.rotate(rotation * Math.PI / 180);
  if (flipped) ctx.scale(-1, 1);
  ctx.drawImage(el, -w / 2, -h / 2, w, h);
  ctx.restore();
  const t = $('txt').value;
  if (t) {
    const fs = $('tsize').value * (cw / 800);
    ctx.font = `bold ${fs}px sans-serif`;
    ctx.textAlign = 'center'; ctx.fillStyle = $('tcol').value;
    ctx.strokeStyle = 'rgba(0,0,0,.7)'; ctx.lineWidth = fs / 8;
    const y = ch * $('ty').value / 100;
    ctx.strokeText(t, cw / 2, y); ctx.fillText(t, cw / 2, y);
  }
}
function startLoop() {
  cancelAnimationFrame(raf);
  const loop = () => { draw(); raf = requestAnimationFrame(loop); };
  loop();
}
function rot() { rotation = (rotation + 90) % 360; }
function flip() { flipped = !flipped; }
function playPrev() {
  el.currentTime = +$('vstart').value; el.playbackRate = +$('vspeed').value; el.muted = false; el.play();
  const chk = () => { if (el && !el.paused && el.currentTime >= +$('vend').value) el.pause(); else if (el && !el.paused) requestAnimationFrame(chk); };
  chk();
}

// ===== Export =====
async function exportMedia(saveToServer) {
  if (exporting) return;
  exporting = true;
  let blob, name;
  if (kind === 'image') {
    blob = await new Promise(r => cv.toBlob(r, 'image/png'));
    name = 'edit-' + Date.now() + '.png';
  } else {
    blob = await recordVideo();
    name = 'edit-' + Date.now() + '.webm';
  }
  exporting = false;
  if (saveToServer) {
    const fd = new FormData(); fd.append('files', new File([blob], name, { type: blob.type }));
    await fetch('/api/upload', { method: 'POST', body: fd });
    $('status').textContent = '✅ Tersimpan di drive D: (cek library)'; load();
  } else {
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click();
    $('status').textContent = '✅ Terdownload';
  }
}
function recordVideo() {
  return new Promise(resolve => {
    const start = +$('vstart').value, end = +$('vend').value, speed = +$('vspeed').value;
    const stream = cv.captureStream(30);
    try { el.captureStream().getAudioTracks().forEach(t => stream.addTrack(t)); } catch {}
    const rec = new MediaRecorder(stream, { mimeType: 'video/webm' });
    const chunks = [];
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = () => resolve(new Blob(chunks, { type: 'video/webm' }));
    el.pause(); el.currentTime = start; el.playbackRate = speed; el.muted = false;
    el.onseeked = () => {
      el.onseeked = null; rec.start(); el.play();
      const tick = () => {
        $('status').textContent = `Merekam... ${Math.max(0, (el.currentTime - start)).toFixed(1)} / ${(end - start).toFixed(1)} dtk (kecepatan 1x real-time)`;
        if (el.currentTime >= end || el.ended) { el.pause(); rec.stop(); }
        else requestAnimationFrame(tick);
      };
      tick();
    };
  });
}
load();
</script>
</body>
</html>
